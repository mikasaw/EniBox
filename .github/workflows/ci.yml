name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  dotnet-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - uses: microsoft/setup-msbuild@v2
      - name: 编译 native DLLs (GUI csproj 的 Content 依赖)
        run: |
          msbuild src/EniBox.PeTool/EniBox.PeTool.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningsAsErrors=true
          msbuild src/EniBox.Loader/EniBox.Loader.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningsAsErrors=true
      # csproj 固定 RuntimeIdentifier=win-x64，restore 必须带 -r 下载 runtime pack
      - run: dotnet restore -r win-x64
      - run: |
          dotnet build src/EniBox.GUI/EniBox.GUI.csproj -c Release -r win-x64 --no-restore --nologo -v:minimal
          dotnet build tests/EniBox.Tests/EniBox.Tests.csproj -c Release -r win-x64 --no-restore --nologo -v:minimal

  msvc-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      # GitHub runner 只有 VS2022/v143；本地开发用 v145，CI 侧显式降级
      - run: |
          msbuild src/EniBox.PeTool/EniBox.PeTool.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningsAsErrors=true
          msbuild src/EniBox.Loader/EniBox.Loader.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningsAsErrors=true

  dotnet-test:
    needs: [dotnet-build, msvc-build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - uses: microsoft/setup-msbuild@v2
      - name: 编译 native DLLs (GUI csproj 的 Content 依赖)
        run: |
          msbuild src/EniBox.PeTool/EniBox.PeTool.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningsAsErrors=true
          msbuild src/EniBox.Loader/EniBox.Loader.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningsAsErrors=true
      # csproj 固定 RuntimeIdentifier=win-x64，restore 必须带 -r 下载 runtime pack
      - run: dotnet restore -r win-x64
      - run: |
          dotnet build src/EniBox.GUI/EniBox.GUI.csproj -c Release -r win-x64 --no-restore --nologo -v:minimal
          dotnet build tests/EniBox.Tests/EniBox.Tests.csproj -c Release -r win-x64 --no-restore --nologo -v:minimal
      # -r 构建的输出在 win-x64 子目录，--no-build 会找不到测试程序集；
      # 让 dotnet test 自带构建以保持 RID 一致
      - run: dotnet test tests/EniBox.Tests/EniBox.Tests.csproj -c Release -r win-x64 --logger "console;verbosity=detailed"

  e2e-verify:
    needs: [dotnet-build, msvc-build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - uses: microsoft/setup-msbuild@v2
      - name: 编译 native DLLs (PeTool + Loader)
        run: |
          msbuild src/EniBox.PeTool/EniBox.PeTool.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningsAsErrors=true
          msbuild src/EniBox.Loader/EniBox.Loader.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningsAsErrors=true
      - name: 编译 GUI + Tests
        run: |
          dotnet build src/EniBox.GUI/EniBox.GUI.csproj -c Release --nologo -v:minimal
          dotnet build tests/EniBox.Tests/EniBox.Tests.csproj -c Release --nologo -v:minimal
      - name: 构建测试辅助程序 (runner 上没有预编译 publish 产物)
        shell: pwsh
        run: |
          # 必须单文件：封包把 exe 复制到临时目录独立运行，非单文件 apphost
          # 会因找不到旁边的 dll 在 .NET 初始化即失败（exit 0x8001009A）
          dotnet publish tests/TestHelpers/FileChecker/FileChecker.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true --nologo -o tests/TestHelpers/FileChecker/publish
          dotnet publish tests/TestHelpers/RegChecker/RegChecker.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true --nologo -o tests/TestHelpers/RegChecker/publish
          dotnet publish tests/TestHelpers/SubProcChild/SubProcChild.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true --nologo -o tests/TestHelpers/SubProcChild/publish
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -property installationPath
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1 && cd /d tests\TestHelpers\VfsTest && cl /nologo /W3 /O2 vfstest.c /Fe:VfsTest.exe advapi32.lib && if not exist publish mkdir publish && copy /y VfsTest.exe publish\"
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1 && cd /d tests\TestHelpers\SubProcHost && cl /nologo /W3 /O2 host.c /Fe:SubProcHost.exe kernel32.lib && if not exist publish mkdir publish && copy /y SubProcHost.exe publish\"
      - name: 跑 E2E 验证脚本 (verify-e2e.ps1)
        id: e2e
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/verify-e2e.ps1 -SkipNativeBuild
      - name: 输出 Loader 注入/继承诊断（§5.1.5 取证）
        if: always()
        shell: pwsh
        run: |
          $logs = Get-ChildItem "$env:TEMP\EniBox_diag_*.log" -ErrorAction SilentlyContinue
          if ($logs) {
            foreach ($l in $logs) {
              Write-Host "=== $($l.Name)"
              Get-Content $l.FullName | ForEach-Object { Write-Host "  $_" }
            }
          } else {
            Write-Host "no EniBox_diag files"
          }
      - name: 上传 TRX 报告 (失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-e2e-trx
          path: tests/EniBox.Tests/TestResults/verify-e2e-*.trx
          if-no-files-found: warn

  cli-mode-build:
    # CLI_MODE 变体（EniBox.CLI，无 WPF/WinForms 依赖）曾因没人编译而烂掉
    # （Program.cs 的 #if !CLI_MODE 守卫缺失导致双 Main）。这个 job 保证它
    # 永远在 CI 里被编译 + 冒烟。
    needs: [dotnet-build, msvc-build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - uses: microsoft/setup-msbuild@v2
      - name: 编译 native DLLs (PeTool + Loader)
        run: |
          msbuild src/EniBox.PeTool/EniBox.PeTool.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningsAsErrors=true
          msbuild src/EniBox.Loader/EniBox.Loader.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningsAsErrors=true
      - name: 编译 CLI_MODE 变体 (EniBox.CLI)
        run: dotnet build src/EniBox.GUI/EniBox.GUI.csproj -c Release -p:CLI_MODE=true --nologo -v:minimal
      - name: CLI 冒烟 (--help)
        run: src/EniBox.GUI/bin/Release/net8.0-windows/win-x64/EniBox.CLI.exe --help